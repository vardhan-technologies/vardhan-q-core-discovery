apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "vardhan-qcore.fullname" . }}-scan
  labels:
    app.kubernetes.io/name: {{ include "vardhan-qcore.name" . }}
    helm.sh/chart: {{ include "vardhan-qcore.chart" . }}
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ include "vardhan-qcore.name" . }}
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      hostNetwork: false

      securityContext:
        runAsNonRoot: true
        runAsUser: {{ .Values.security.runAsUser }}
        runAsGroup: {{ .Values.security.runAsGroup }}
        fsGroup: {{ .Values.security.runAsGroup }}
        seccompProfile:
          type: RuntimeDefault

      containers:
        - name: qcore
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command:
            - /usr/local/bin/qcore
            - scan
            - /workspace
            - -f
            - {{ .Values.scan.format }}
            - -o
            - /reports/cbom.json
            - --project-name
            - {{ .Values.scan.projectName | quote }}

          securityContext:
            readOnlyRootFilesystem: {{ .Values.security.readOnlyRootFilesystem }}
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                {{- toYaml .Values.security.dropCapabilities | nindent 16 }}

          resources:
            {{- toYaml .Values.resources | nindent 12 }}

          volumeMounts:
            - name: source-code
              mountPath: /workspace
              readOnly: true
            - name: scan-reports
              mountPath: /reports
              readOnly: false
            - name: ephemeral-tmp
              mountPath: /tmp

      volumes:
        - name: source-code
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.sourcePvcName }}
            readOnly: true
        - name: scan-reports
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.reportsPvcName }}
        - name: ephemeral-tmp
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
