- id: java-ecb-mode
  language: java
  regex: 'Cipher\.getInstance\s*\(\s*["''][^"'']+/ECB/[^"'']*["'']'
  finding:
    category: weak-classical-cryptography
    algorithm: ECB-Mode
    primitive: block-cipher
    quantum_vulnerable: false
    severity: HIGH
    message: Electronic Codebook (ECB) cipher mode detected. ECB does not provide semantic security and leaks data patterns.
    remediation: Switch to Authenticated Encryption with Associated Data (AEAD) such as AES/GCM/NoPadding.
    references:
      - NIST SP 800-38D
  tests:
    must_match:
      - 'Cipher c = Cipher.getInstance("AES/ECB/PKCS5Padding");'
      - 'Cipher c = Cipher.getInstance("DES/ECB/NoPadding");'
    must_not_match:
      - 'Cipher c = Cipher.getInstance("AES/GCM/NoPadding");'

- id: js-hash-md5
  language: javascript
  regex: 'crypto\.createHash\s*\(\s*["'']md5["'']'
  finding:
    category: weak-classical-cryptography
    algorithm: MD5
    primitive: hash
    quantum_vulnerable: false
    severity: MEDIUM
    message: Node.js crypto createHash with MD5.
    remediation: Upgrade to SHA-256.
    references:
      - NIST SP 800-131A
  tests:
    must_match:
      - "const hash = crypto.createHash('md5');"
      - 'const hash = crypto.createHash("md5");'
    must_not_match:
      - "const hash = crypto.createHash('sha256');"

